name: Build & Deploy to GitHub Pages

on:
push:
branches: ["main"]
workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: "pages"
cancel-in-progress: false

jobs:
build:
runs-on: ubuntu-latest
name: Build CaisterPlayz Gaming Platform

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "20"
      cache: "npm"

  - name: Install dependencies
    run: npm ci --legacy-peer-deps

  - name: Lint check
    run: npm run lint --if-present
    continue-on-error: true

  - name: Build for production
    run: npm run build
    env:
      VITE_BASE: /CaisterPlayz/
      VITE_PB_URL: ${{ secrets.VITE_PB_URL }}

  - name: Verify build output
    run: |
      if [ ! -d "dist" ]; then
        echo "❌ Build failed: dist directory not found"
        exit 1
      fi

      if [ ! -f "dist/index.html" ]; then
        echo "❌ Build failed: index.html not found in dist"
        exit 1
      fi

      echo "✅ Build verification passed!"
      du -sh dist/

  - name: Upload artifacts
    uses: actions/upload-artifact@v4
    with:
      name: build-artifacts
      path: dist/
      retention-days: 7

  - name: Setup Pages
    uses: actions/configure-pages@v4

  - name: Upload dist to Pages
    uses: actions/upload-pages-artifact@v3
    with:
      path: dist

  - name: Deploy to GitHub Pages
    id: deployment
    uses: actions/deploy-pages@v4

  - name: Deployment Success
    run: |
      echo "🎮 CaisterPlayz Gaming Platform Deployed!"
      echo "📱 https://Caister062.github.io/CaisterPlayz/"
      echo "📦 Commit: ${{ github.sha }}"
      echo "⏰ $(date -u)"
```
