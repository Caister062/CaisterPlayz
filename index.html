  <body>
    <div id="root">

      <style>
        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          overflow: hidden;
          background:
            radial-gradient(
              circle at top,
              rgba(59,130,246,.15),
              transparent 35%
            ),
            #070b14;

          color: white;

          font-family:
            "Plus Jakarta Sans",
            system-ui,
            sans-serif;
        }

        .startup-loader {
          position: fixed;
          inset: 0;

          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;

          gap: 20px;

          background: #070b14;

          z-index: 99999;
        }

        .logo-container {
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .logo-icon {
          width: 52px;
          height: 52px;

          border-radius: 14px;

          background:
            linear-gradient(
              135deg,
              #2563eb,
              #60a5fa
            );

          display: flex;
          align-items: center;
          justify-content: center;

          box-shadow:
            0 0 30px rgba(59,130,246,.4);

          animation: float 2s ease-in-out infinite;
        }

        .logo-text {
          font-size: 2rem;
          font-weight: 800;
          letter-spacing: 0.08em;

          background:
            linear-gradient(
              90deg,
              #ffffff,
              #60a5fa
            );

          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .tagline {
          font-size: 0.85rem;
          color: #94a3b8;
          letter-spacing: 0.15em;
          text-transform: uppercase;
        }

        .loading-bar {
          width: 220px;
          height: 8px;

          border-radius: 999px;

          overflow: hidden;

          background:
            rgba(255,255,255,.08);
        }

        .loading-fill {
          width: 50%;
          height: 100%;

          background:
            linear-gradient(
              90deg,
              #2563eb,
              #60a5fa
            );

          animation: loading 1.2s infinite;
        }

        @keyframes loading {
          0% {
            transform: translateX(-100%);
          }

          100% {
            transform: translateX(300%);
          }
        }

        @keyframes float {
          0%,
          100% {
            transform: translateY(0);
          }

          50% {
            transform: translateY(-5px);
          }
        }
      </style>

      <div class="startup-loader">

        <div class="logo-container">

          <div class="logo-icon">
            🎮
          </div>

          <div class="logo-text">
            CAISTERPLAYZ
          </div>

        </div>

        <div class="tagline">
          Find Players • Build Squads • Share Wins
        </div>

        <div class="loading-bar">
          <div class="loading-fill"></div>
        </div>

      </div>
    </div>

  </body>
</html>
