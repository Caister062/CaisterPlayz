  <body>
    <div id="root">
      <style>
        body { margin: 0; background-color: #0b0c0f; overflow: hidden; }
        .startup-loader {
          position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: #0b0c0f; z-index: 9999;
        }
        .glow-logo {
          font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
          font-size: 2.2rem; font-weight: 800; letter-spacing: -1.5px;
          color: #fff;
          background: linear-gradient(135deg, #1d9bf0 0%, #8b5cf6 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: pulseGlow 1.5s infinite alternate ease-in-out; margin-bottom: 2rem;
        }
        .spinner {
          width: 32px; height: 32px; border: 3px solid rgba(29, 155, 240, 0.1);
          border-radius: 50%; border-top-color: #1d9bf0; animation: spin 0.8s linear infinite;
        }
        @keyframes pulseGlow { 
          0% { transform: scale(1); opacity: 0.95; } 
          100% { transform: scale(1.04); opacity: 1; } 
        }
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
      <div class="startup-loader">
        <div class="glow-logo">CaisterPlayz</div>
        <div class="spinner"></div>
      </div>
    </div>
  </body>
